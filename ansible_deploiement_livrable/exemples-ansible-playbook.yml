---
- name: Installer et configurer Nginx
  hosts: webservers
  become: true

  tasks:
    - name: Installer Nginx sur Debian
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Installer Nginx sur Red Hat
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Activer et démarrer Nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

