---
- name: Mettre à jour les serveurs
  hosts: all
  become: true

  tasks:
    - name: Mise à jour Debian/Ubuntu
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Mise à jour Red Hat/Rocky/Alma
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true
      when: ansible_os_family == "RedHat"


#Creer des utilisateurs avec une clé SSH

---
- name: Configurer un utilisateur administrateur
  hosts: all
  become: true

  vars:
    admin_user: ansibleadmin
    ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."

  tasks:
    - name: Créer l'utilisateur
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true
      when: ansible_os_family == "Debian"

    - name: Créer l'utilisateur sur Red Hat
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: wheel
        append: true
        create_home: true
      when: ansible_os_family == "RedHat"

    - name: Installer la clé SSH
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ ssh_public_key }}"
        state: present




